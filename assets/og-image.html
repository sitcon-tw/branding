<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>SITCON Brand Guidelines — Open Graph Image</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #fff;
        color: #181818;
        font-family: "Helvetica Neue", Arial, "Noto Sans CJK TC", sans-serif;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 2px 1fr;
        gap: 40px;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 64px;
      }

      .logo {
        display: block;
        justify-self: center;
        width: 480px;
        height: auto;
      }

      .divider {
        width: 2px;
        height: 288px;
        background: #77b55a;
      }

      .copy {
        position: relative;
        z-index: 1;
        justify-self: center;
        width: max-content;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-family: "Noto Sans CJK TC", sans-serif;
        font-size: 56px;
        font-weight: 800;
        line-height: 1.15;
        white-space: nowrap;
      }

      h2 {
        margin-top: 16px;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }

      p {
        margin-top: 24px;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0.015em;
        white-space: nowrap;
      }

      .circle,
      .dots {
        position: absolute;
        background-color: #77b55a;
      }

      .circle {
        border-radius: 50%;
      }

      .circle--top-left {
        top: -88px;
        left: -88px;
        width: 176px;
        height: 176px;
      }

      .circle--top-right {
        top: -64px;
        right: -64px;
        width: 128px;
        height: 128px;
      }

      .circle--bottom-right {
        right: -88px;
        bottom: -88px;
        width: 176px;
        height: 176px;
      }

      .dots {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        box-shadow:
          24px 0 #77b55a,
          48px 0 #77b55a,
          0 24px #77b55a,
          24px 24px #77b55a,
          48px 24px #77b55a,
          0 48px #77b55a,
          24px 48px #77b55a,
          48px 48px #77b55a;
      }

      .dots--top-right {
        top: 32px;
        right: 128px;
      }

      .dots--bottom-left {
        bottom: 80px;
        left: 32px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="circle circle--top-left"></div>
      <div class="circle circle--top-right"></div>
      <div class="circle circle--bottom-right"></div>
      <div class="dots dots--top-right"></div>
      <div class="dots dots--bottom-left"></div>

      <img class="logo" src="logos/withname-no-padding.svg" alt="SITCON" />
      <div class="divider"></div>
      <section class="copy">
        <h1>品牌使用規範</h1>
        <h2>Brand Guidelines</h2>
        <p>Logo · Colors · Naming</p>
      </section>
    </main>
  </body>
</html>
